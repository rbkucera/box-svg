[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxsvg"
version = "0.1.0"
description = "Parametric SVG dieline generator for cardboard boxes"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
boxsvg = "boxsvg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
